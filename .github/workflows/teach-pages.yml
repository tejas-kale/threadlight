name: Teach Pages

on:
  pull_request:
    paths:
      - "teach/**"
      - ".github/workflows/teach-pages.yml"
  push:
    branches: [main]
    paths:
      - "teach/**"
      - ".github/workflows/teach-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check teaching site
        run: test -f teach/index.html && test -f teach/assets/site.css && find teach/lessons -name '*.html' -print -quit | grep -q .
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: teach
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
